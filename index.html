<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>10k Challenge</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3694E9" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">

    <!-- App Header -->
    <header class="heading">
      <img class="tkc-icon" src="./icons/tkc-icon-72.png" alt="10k icon">
      <h1>10k Challenge</h1>
    </header>

    <!-- Tabs -->
    <nav class="nav">
      <button class="tab active" data-view="current">Aktuell</button>
      <button class="tab" data-view="stats">Statistik</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>

    <!-- Aktuell -->
    <section id="currentView">
      <div class="year-summary">
        <span>Gesamt</span>
        <strong id="yearTotalCurrent">0</strong>
      </div>

      <hr>

      <div id="ModeToggleContainer">
        <span>Werte updaten</span>
        <label class="switch">
          <input type="checkbox" id="addModeToggle">
          <span class="slider round"></span>
        </label>
        <span>Set addieren</span>
      </div>

      <div class="date-select">
        <label>Datum:</label>
        <input type="date" id="datePicker" class="date-input" />  
      </div>

      <div id="currentExercises"></div>

      <div class="save-current-btn-container">
        <button id="saveCurrentBtn">Speichern</button>
      </div>
      
    </section>

    <!-- Statistik -->
    <section id="statsView" hidden>
      <select id="yearSelect"></select>
      <div class="year-summary">
        <span>Gesamt</span>
        <strong id="yearTotalStats">0</strong>
      </div>

      <canvas id="statsPlot" width="360" height="150"></canvas>
      <div id="yearGrid"></div>
    </section>

    <!-- Settings -->
    <section id="settingsView" hidden>
      <div id="exerciseList"></div>
      <div class="add-exercise-button-container">
        <button id="addExerciseBtn" class="add-btn">＋</button>
      </div>
      <div class="data-actions">
        <button id="exportBtn">Export Daten</button>

        <button id="importBtn">Import Daten</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </section>

  </main>

  <!-- Exercise Modal -->
  <div id="exerciseModal" class="modal" hidden>
    <div class="modal-content">
      <h3>Übung</h3>

      <label for="exerciseName">Name</label>
      <input id="exerciseName" placeholder="Name" />

      <label for="exerciseWeight">Gewicht</label>
      <input id="exerciseWeight" type="number" min="1" value="1" />

      <label for="exerciseUnit">Einheit</label>
      <select id="exerciseUnit">
        <option value="Wdh">Wdh</option>
        <option value="km">km</option>
        <option value="min">Minuten</option>
        <option value="h">Stunden</option>
      </select>

      <div class="modal-actions">
        <button id="exerciseSaveBtn">Save</button>
        <button id="exerciseCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="deleteModal" class="modal" hidden>
    <div class="modal-content">
      <p id="deleteText"></p>
      <div class="modal-actions">
        <button id="deleteConfirmBtn">Confirm</button>
        <button id="deleteCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
